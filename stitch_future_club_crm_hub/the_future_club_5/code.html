<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&amp;family=Hanken+Grotesk:wght@400;500;600&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            background-color: #050505;
            overflow-x: hidden;
            background-attachment: fixed;
        }
        /* Full Glassmorphism Theme Styles */
        .glass-main-bg {
            background: radial-gradient(circle at 50% 50%, rgba(20, 22, 26, 0.4) 0%, rgba(5, 5, 5, 0.8) 100%);
            backdrop-filter: blur(8px);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }
        .glass-input {
            background: rgba(255, 255, 255, 0.02);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.5rem;
            transition: all 0.3s ease;
        }
        .glass-input:focus-within {
            background: rgba(255, 255, 255, 0.05);
            border-color: rgba(0, 245, 212, 0.3);
            box-shadow: 0 0 15px rgba(0, 245, 212, 0.1);
        }
        .glow-cyan {
            box-shadow: 0 0 20px rgba(0, 245, 212, 0.3);
        }
        .glow-cyan:hover {
            box-shadow: 0 0 30px rgba(0, 245, 212, 0.5);
        }
        .geometric-bg {
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 245, 212, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(152, 0, 68, 0.08) 0%, transparent 40%);
        }
    </style>

<style>
        body {
            min-height: max(884px, 100dvh);
        }

<body class="bg-surface-container-lowest text-on-surface min-h-screen flex items-center justify-center font-body-md geometric-bg">
<!-- Semi-transparent overlay with backdrop blur for main background -->
<div class="fixed inset-0 z-0 glass-main-bg pointer-events-none"></div>
<div class="absolute inset-0 z-0 opacity-10 pointer-events-none">
<div class="h-full w-full bg-[radial-gradient(#ffffff20_1px,transparent_1px)] [background-size:32px_32px]"></div>
</div>
<main class="relative z-10 w-full max-w-[440px] px-container-padding-mobile md:px-0">
<div class="flex flex-col items-center mb-10">
<h1 class="font-display-lg text-headline-lg text-primary-container tracking-tighter drop-shadow-[0_0_12px_rgba(0,245,212,0.6)] mb-2">
                FUTURE CLUB
            </h1>
<p class="font-headline-md text-headline-md text-on-surface-variant text-center">
                مرحباً بك مجدداً
            </p>
<p class="font-body-md text-body-md text-outline mt-1">سجل الدخول لإدارة ثروتك المستقبلية</p>
</div>
<div class="glass-card p-8 md:p-10 rounded-2xl">
<form class="space-y-6" id="loginForm">
<div class="space-y-2 group">
<label class="font-label-md text-label-md text-primary-container block transition-all group-focus-within:opacity-100 opacity-70" for="email">
                        البريد الإلكتروني
                    </label>
<div class="relative flex items-center glass-input px-4 py-2 transition-all">
<span class="material-symbols-outlined text-outline ml-3">alternate_email</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md font-body-md placeholder:text-surface-variant" id="email" placeholder="name@futureclub.com" required="" type="email"/>
</div>
</div>
<div class="space-y-2 group">
<label class="font-label-md text-label-md text-primary-container block transition-all group-focus-within:opacity-100 opacity-70" for="password">
                        كلمة المرور
                    </label>
<div class="relative flex items-center glass-input px-4 py-2 transition-all">
<span class="material-symbols-outlined text-outline ml-3">lock</span>
<input class="bg-transparent border-none focus:ring-0 w-full text-body-md font-body-md placeholder:text-surface-variant" id="password" placeholder="••••••••" required="" type="password"/>
<button class="text-outline hover:text-primary-container transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between font-label-md text-label-md">
<label class="flex items-center cursor-pointer select-none">
<input class="rounded-sm bg-transparent border-outline-variant text-primary-container focus:ring-primary-container ml-2" type="checkbox"/>
<span class="text-on-surface-variant">تذكرني</span>
</label>
<a class="text-primary-container hover:underline transition-all" href="#">نسيت كلمة المرور؟</a>
</div>
<button class="w-full bg-primary-container text-on-primary font-headline-md py-4 rounded-lg glow-cyan active:scale-95 transition-all flex items-center justify-center gap-2 group" type="submit">
<span>تسجيل الدخول</span>
<span class="material-symbols-outlined transition-transform group-hover:-translate-x-1">arrow_back</span>
</button>
</form>
<div class="mt-8">
<div class="relative flex items-center justify-center mb-8">
<div class="border-t border-white/10 w-full"></div>
<span class="bg-[#1a1c20]/80 backdrop-blur-md px-4 text-outline font-label-md text-label-md absolute">أو عبر</span>
</div>
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-white/10 hover:bg-white/5 transition-colors font-body-md text-body-md text-on-surface">
<img alt="Google" class="w-5 h-5 grayscale group-hover:grayscale-0" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBTxoZQ6pcETPz0KY-6cGTcp3szrilrjcE66OFRwaBG3dOlwd0KEBrsNkrKGX-vt895eBNNNQMmMa9uzxrQhV3PDFk-RpthVMNA-KEypCxmDQJZslfqTUnYdF9L9895A9RGJgJLEB_H5vo10yHm8lQOZaV5HcjKLO5njYqoMgJ09A-dEj-zMxRqYkaRZXEon4fLS20BAz2fxsREYBoe9pRVzwNWQtU37EJcxZIXO-0CofN-hvwI6qM_c44buQpUzS9BNZ2-Cc-1Gm9j"/>
<span>جوجل</span>
</button>
<button class="flex items-center justify-center gap-2 py-3 px-4 rounded-lg border border-white/10 hover:bg-white/5 transition-colors font-body-md text-body-md text-on-surface">
<span class="material-symbols-outlined text-on-surface">ios</span>
<span>آبل</span>
</button>
</div>
</div>
</div>
<div class="mt-10 text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                مستخدم جديد؟ 
                <a class="text-primary-container font-semibold hover:underline mr-1" href="#">إنشاء حساب</a>
</p>
</div>
</main>
<div class="fixed bottom-10 left-10 hidden lg:block opacity-40 z-20">
<div class="flex flex-col gap-2 font-mono-data text-mono-data text-outline">
<div class="flex items-center gap-2">
<span class="w-2 h-2 rounded-full bg-primary-container animate-pulse"></span>
<span>النظام: متصل</span>
</div>
<div>التشفير: AES-256 كوانتوم</div>
</div>
</div>
<script>
        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            btn.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span> جار التحقق...';
            btn.classList.add('opacity-80', 'cursor-wait');
            
            setTimeout(() => {
                btn.innerHTML = originalContent;
                btn.classList.remove('opacity-80', 'cursor-wait');
                alert('مرحباً بك في نادي المستقبل!');
            }, 1500);
        });

        // Background movement effect
        document.addEventListener('mousemove', (e) => {
            const moveX = (e.clientX - window.innerWidth / 2) * 0.01;
            const moveY = (e.clientY - window.innerHeight / 2) * 0.01;
            document.body.style.backgroundPosition = `${moveX}px ${moveY}px`;
        });
    </script>
</body></html>
