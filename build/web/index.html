<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="The Future Club">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>The Future Club - Financial Consulting</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      background-color: #0b0f19;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background-color: #0b0f19;
      transition: opacity 0.4s ease-out, visibility 0.4s ease-out;
    }
    .loading-container.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }
    .logo-avatar {
      width: 110px;
      height: 110px;
      border-radius: 28px;
      background: rgba(18, 24, 38, 0.95);
      border: 1px solid rgba(212, 175, 55, 0.3);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      animation: pulse 2s infinite ease-in-out;
      margin-bottom: 24px;
      padding: 12px;
    }
    .logo-avatar img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .loading-title {
      color: #D4AF37;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 8px;
      text-shadow: 0 0 12px rgba(212, 175, 55, 0.3);
    }
    .loading-sub {
      color: #94A3B8;
      font-size: 13px;
    }
    .spinner {
      margin-top: 20px;
      width: 32px;
      height: 32px;
      border: 3px solid rgba(212, 175, 55, 0.15);
      border-top: 3px solid #D4AF37;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), 0 0 30px rgba(212, 175, 55, 0.25); }
      50% { transform: scale(1.05); box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 45px rgba(212, 175, 55, 0.45); }
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-screen" class="loading-container">
    <div class="logo-avatar">
      <img src="assets/assets/images/logo.png" alt="TFC Logo" onerror="this.src='favicon.png'">
    </div>
    <div class="loading-title">The Future Club</div>
    <div class="loading-sub">Financial Consulting CRM</div>
    <div class="spinner"></div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for(let registration of registrations) {
          registration.unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (let name of names) caches.delete(name);
      });
    }
    function hideLoadingScreen() {
      var loader = document.getElementById('loading-screen');
      if (loader) {
        loader.classList.add('fade-out');
        setTimeout(function() {
          if (loader && loader.parentNode) {
            loader.parentNode.removeChild(loader);
          }
        }, 450);
      }
    }

    // Hide loader when Flutter app first frame is rendered or after max 3.5 seconds
    window.addEventListener('flutter-first-frame', hideLoadingScreen);
    setTimeout(hideLoadingScreen, 3500);

    var script = document.createElement('script');
    script.src = 'flutter_bootstrap.js?v=' + new Date().getTime();
    script.async = true;
    document.body.appendChild(script);
  </script>
</body>
</html>
